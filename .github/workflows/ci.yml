name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
          target: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Windows Clippy
        run: cargo clippy -p whale-widget-win --target x86_64-pc-windows-gnu -- -D warnings
      - name: Build Linux release components
        run: cargo build --release -p cpa-whale-plugin -p cpa-whale-admin
      - name: Run plugin ABI harness
        env:
          CPA_WHALE_PLUGIN: target/release/libcpa_whale_plugin.so
        run: python3 tests/abi_harness.py
      - name: Build Windows release client
        run: cargo build --release -p whale-widget-win --target x86_64-pc-windows-gnu
      - name: Scan public tree
        run: python3 scripts/check-public-tree.py
      - name: Stage CI binaries
        run: |
          mkdir -p ci-artifacts
          cp target/release/libcpa_whale_plugin.so ci-artifacts/cpa-whale-plugin-linux-amd64.so
          cp target/release/cpa-whale-admin ci-artifacts/cpa-whale-admin-linux-amd64
          cp target/x86_64-pc-windows-gnu/release/cpa-whale.exe ci-artifacts/cpa-whale-windows-x64.exe
          cd ci-artifacts
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-whale-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14
