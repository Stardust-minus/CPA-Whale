name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
          target: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Validate release tag
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          root = pathlib.Path("Cargo.toml")
          version = tomllib.loads(root.read_text())["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch" and tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match workspace version v{version}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"VERSION={version}\n")
              env.write(f"RELEASE_DIR=release-output/cpa-whale-v{version}\n")
          PY
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Windows Clippy
        run: cargo clippy -p whale-widget-win --target x86_64-pc-windows-gnu -- -D warnings
      - name: Build release components
        run: |
          cargo build --release -p cpa-whale-plugin -p cpa-whale-admin
          cargo build --release -p whale-widget-win --target x86_64-pc-windows-gnu
      - name: Run ABI harness
        env:
          CPA_WHALE_PLUGIN: target/release/libcpa_whale_plugin.so
        run: python3 tests/abi_harness.py
      - name: Check Windows PE imports and resources
        run: |
          exe=target/x86_64-pc-windows-gnu/release/cpa-whale.exe
          x86_64-w64-mingw32-objdump -p "$exe" > /tmp/cpa-whale-imports.txt
          grep -q D3D11CreateDevice /tmp/cpa-whale-imports.txt
          grep -q DCompositionCreateDevice /tmp/cpa-whale-imports.txt
          grep -q DwmFlush /tmp/cpa-whale-imports.txt
          grep -q SetWindowRgn /tmp/cpa-whale-imports.txt
          ! grep -q UpdateLayeredWindow /tmp/cpa-whale-imports.txt
          x86_64-w64-mingw32-objdump -h "$exe" | grep -q '\.rsrc'
      - name: Scan public tree
        run: python3 scripts/check-public-tree.py
      - name: Assemble release bundle
        run: |
          mkdir -p build-output/release-linux build-output/release-windows
          cp target/release/libcpa_whale_plugin.so build-output/release-linux/cpa-whale-plugin-linux-amd64.so
          cp target/release/cpa-whale-admin build-output/release-linux/cpa-whale-admin-linux-amd64
          cp target/x86_64-pc-windows-gnu/release/cpa-whale.exe build-output/release-windows/cpa-whale-windows-x64.exe
          python3 scripts/build-release.py --skip-build --output release-output
          tar -C release-output -czf "cpa-whale-v${VERSION}.tar.gz" "cpa-whale-v${VERSION}"
          cd "$RELEASE_DIR"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-whale-v${{ env.VERSION }}
          path: |
            ${{ env.RELEASE_DIR }}/
            cpa-whale-v${{ env.VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            "$RELEASE_DIR/cpa-whale-plugin-v${VERSION}-linux-amd64.so"
            "$RELEASE_DIR/cpa-whale-admin-v${VERSION}-linux-amd64"
            "$RELEASE_DIR/cpa-whale-v${VERSION}-windows-x64.exe"
            "$RELEASE_DIR/release-manifest.json"
            "$RELEASE_DIR/SHA256SUMS"
            "cpa-whale-v${VERSION}.tar.gz"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "CPA Whale v${VERSION}" \
              --generate-notes
          fi
