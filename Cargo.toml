[workspace]
members = [
  "crates/whale-protocol",
  "crates/whale-core",
  "crates/cpa-whale-plugin",
  "crates/cpa-whale-admin",
  "crates/whale-widget-win",
]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
authors = ["CPA Whale contributors"]
rust-version = "1.89"

[workspace.dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde", "clock"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
crossbeam-channel = "0.5.15"
image = { version = "0.25.8", default-features = false, features = ["png", "gif"] }
parking_lot = "0.12.4"
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
subtle = "2.6.1"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3.1"
windows-sys = { version = "0.59.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"
